[workspace]
resolver = "2"
members = [
    "crates/math",
    "crates/dom",
    "crates/style",
    "crates/render",
    "crates/path-ops",
    "crates/text",
    "crates/filters",
    "crates/trace",
    "crates/io",
    "crates/core",
    "crates/plugin",
    "crates/ui",
    "crates/desktop",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
# Internal crates
sivgo-math = { path = "crates/math" }
sivgo-dom = { path = "crates/dom" }
sivgo-style = { path = "crates/style" }
sivgo-render = { path = "crates/render" }
sivgo-path-ops = { path = "crates/path-ops" }
sivgo-text = { path = "crates/text" }
sivgo-filters = { path = "crates/filters" }
sivgo-trace = { path = "crates/trace" }
sivgo-io = { path = "crates/io" }
sivgo-core = { path = "crates/core" }
sivgo-plugin = { path = "crates/plugin" }
sivgo-ui = { path = "crates/ui" }

# External dependencies
kurbo = "0.13"
tiny-skia = "0.12"
tiny-skia-path = "0.12"
roxmltree = "0.21"
xmlwriter = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
png = "0.18"
tempfile = "3"
glory = { path = "../../glory-rs/glory/crates/glory", default-features = false }
sapid = { path = "../../glory-rs/sapid" }
rfd = "0.17"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
jpeg-decoder = "0.3"
i_overlay = "4"
cosmic-text = "0.18"
swash = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
salvo = { version = "0.89", features = ["cors", "logging", "affix-state", "catch-panic", "size-limiter", "timeout"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
arboard = "3"

[profile.release]
opt-level = 3
lto = "thin"
