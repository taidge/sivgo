[package]
name = "sivgo-web"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sivgo-server"
path = "src/main.rs"

[lib]
name = "sivgo_web"
path = "src/lib.rs"

[dependencies]
sivgo-dom = { workspace = true }
sivgo-render = { workspace = true }
salvo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
png = { workspace = true }
jsonwebtoken = "9"
argon2 = "0.5"

[dev-dependencies]
# `test` brings in salvo's TestClient, used by the route tests.
salvo = { workspace = true, features = ["test"] }
tokio = { workspace = true }
