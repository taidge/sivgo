[package]
name = "sivgo-desktop"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sivgo"
path = "src/main.rs"

[dependencies]
sivgo-dom = { workspace = true }
sivgo-style = { workspace = true }
sivgo-render = { workspace = true }
sivgo-io = { workspace = true }
sivgo-math = { workspace = true }
sivgo-core = { workspace = true }
sivgo-plugin = { workspace = true }
sivgo-ui = { workspace = true }
glory = { workspace = true, features = ["blitz-shell"] }
sapid = { workspace = true }
parking_lot = { version = "0.12", features = ["arc_lock"] }
keyboard-types = "0.8"
blitz-dom = { git = "https://github.com/glory-rs/blitz", rev = "ee125981e0e5a217e758be5c470df23cdd9e2fc3", version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { git = "https://github.com/glory-rs/blitz", rev = "ee125981e0e5a217e758be5c470df23cdd9e2fc3", version = "=0.3.0-beta.4", default-features = false }
blitz-shell = { git = "https://github.com/glory-rs/blitz", rev = "ee125981e0e5a217e758be5c470df23cdd9e2fc3", version = "=0.3.0-beta.4", default-features = false }
winit = { git = "https://github.com/glory-rs/winit", rev = "3b6f5a09697acb936567af64e53c915b0b1a2af9", version = "=0.31.0-beta.4" }
tokio = { workspace = true }
rfd = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
png = { workspace = true }
arboard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
glory = { workspace = true, features = ["blitz-raster"] }
