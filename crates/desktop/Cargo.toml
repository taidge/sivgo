[package]
name = "sivgo-desktop"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sivgo"
path = "src/main.rs"

[dependencies]
sivgo-dom = { workspace = true }
sivgo-style = { workspace = true }
sivgo-render = { workspace = true }
sivgo-io = { workspace = true }
sivgo-math = { workspace = true }
sivgo-core = { workspace = true }
sivgo-plugin = { workspace = true }
sivgo-ui = { workspace = true }
glory = { workspace = true, features = ["apace-shell"] }
sapid = { workspace = true }
parking_lot = { version = "0.12", features = ["arc_lock"] }
keyboard-types = "0.8"
apace-dom = { version = "=0.3.0", default-features = false }
apace-traits = { version = "=0.3.0", default-features = false }
apace-shell = { version = "=0.3.0", default-features = false }
wingy = "=0.31.1"
tokio = { workspace = true }
rfd = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
png = { workspace = true }
arboard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
glory = { workspace = true, features = ["apace-raster"] }
