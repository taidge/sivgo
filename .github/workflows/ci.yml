name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_TARGET_DIR: ${{ github.workspace }}/build-cache/target
  TMP: /tmp
  TEMP: /tmp

defaults:
  run:
    working-directory: taidge/sivgo

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Prepare build directories
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p ${{ github.workspace }}/target/verification/sivgo-glory/target ${{ github.workspace }}/target/verification/sivgo-glory/tmp
            echo "CARGO_HOME=${{ github.workspace }}/target/verification/cargo" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_DIR=${{ github.workspace }}/target/verification/sivgo-glory/target" >> "$GITHUB_ENV"
            echo "TMP=${{ github.workspace }}/target/verification/sivgo-glory/tmp" >> "$GITHUB_ENV"
            echo "TEMP=${{ github.workspace }}/target/verification/sivgo-glory/tmp" >> "$GITHUB_ENV"
          else
            echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          fi

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: taidge/sivgo

      - name: Configure compiler temporary files
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('.cargo/config.toml')
          p.write_text(p.read_text().replace('${{ github.workspace }}/target/verification/sivgo-glory/tmp', os.environ['TEMP'].replace(chr(92), '/')))
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps

  # Check native windowing, clipboard, and dialogs on each desktop platform.
  cross-platform-check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Prepare build directories
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p ${{ github.workspace }}/target/verification/sivgo-glory/target ${{ github.workspace }}/target/verification/sivgo-glory/tmp
            echo "CARGO_HOME=${{ github.workspace }}/target/verification/cargo" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_DIR=${{ github.workspace }}/target/verification/sivgo-glory/target" >> "$GITHUB_ENV"
            echo "TMP=${{ github.workspace }}/target/verification/sivgo-glory/tmp" >> "$GITHUB_ENV"
            echo "TEMP=${{ github.workspace }}/target/verification/sivgo-glory/tmp" >> "$GITHUB_ENV"
          else
            echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          fi

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: taidge/sivgo

      - name: Configure compiler temporary files
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('.cargo/config.toml')
          p.write_text(p.read_text().replace('${{ github.workspace }}/target/verification/sivgo-glory/tmp', os.environ['TEMP'].replace(chr(92), '/')))
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check workspace
        run: cargo check --workspace --locked --all-targets

  # `rust-version` in Cargo.toml is a promise to users; without this job it is
  # never tested and drifts the first time a newer API is used.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest

    steps:
      - name: Prepare build directories
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p ${{ github.workspace }}/target/verification/sivgo-glory/target ${{ github.workspace }}/target/verification/sivgo-glory/tmp
            echo "CARGO_HOME=${{ github.workspace }}/target/verification/cargo" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_DIR=${{ github.workspace }}/target/verification/sivgo-glory/target" >> "$GITHUB_ENV"
            echo "TMP=${{ github.workspace }}/target/verification/sivgo-glory/tmp" >> "$GITHUB_ENV"
            echo "TEMP=${{ github.workspace }}/target/verification/sivgo-glory/tmp" >> "$GITHUB_ENV"
          else
            echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          fi

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: taidge/sivgo

      - name: Configure compiler temporary files
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('.cargo/config.toml')
          p.write_text(p.read_text().replace('${{ github.workspace }}/target/verification/sivgo-glory/tmp', os.environ['TEMP'].replace(chr(92), '/')))
          PY

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check workspace
        run: cargo check --workspace --locked

  # The fuzz targets live in their own workspace, so nothing in the main build
  # notices when they stop compiling against a changed API.
  fuzz-build:
    name: Fuzz targets build
    runs-on: ubuntu-latest

    steps:
      - name: Prepare build directories
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p ${{ github.workspace }}/target/verification/sivgo-glory/target ${{ github.workspace }}/target/verification/sivgo-glory/tmp
            echo "CARGO_HOME=${{ github.workspace }}/target/verification/cargo" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_DIR=${{ github.workspace }}/target/verification/sivgo-glory/target" >> "$GITHUB_ENV"
            echo "TMP=${{ github.workspace }}/target/verification/sivgo-glory/tmp" >> "$GITHUB_ENV"
            echo "TEMP=${{ github.workspace }}/target/verification/sivgo-glory/tmp" >> "$GITHUB_ENV"
          else
            echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          fi

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: taidge/sivgo

      - name: Configure compiler temporary files
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('.cargo/config.toml')
          p.write_text(p.read_text().replace('${{ github.workspace }}/target/verification/sivgo-glory/tmp', os.environ['TEMP'].replace(chr(92), '/')))
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo fuzz build

      - name: Smoke-run each target briefly
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            cargo fuzz run "$target" -- -max_total_time=30 -print_final_stats=1
            echo "::endgroup::"
          done
