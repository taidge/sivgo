<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <title>Clipping, Masking, and Filters</title>
  <defs>
    <!-- Clip path -->
    <clipPath id="clip1">
      <circle cx="80" cy="50" r="40"/>
    </clipPath>

    <!-- Mask -->
    <mask id="mask1">
      <rect width="200" height="100" fill="white"/>
      <circle cx="100" cy="50" r="30" fill="black"/>
    </mask>

    <!-- Gaussian blur -->
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow1">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Color matrix -->
    <filter id="grayscale1">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Clipped rectangle -->
  <g clip-path="url(#clip1)">
    <rect x="20" y="10" width="120" height="80" fill="#e74c3c"/>
    <text x="40" y="55" fill="white" font-size="12">Clipped</text>
  </g>

  <!-- Masked rectangle -->
  <g transform="translate(160, 0)">
    <rect x="0" y="10" width="200" height="80" fill="#3498db" mask="url(#mask1)"/>
  </g>

  <!-- Blurred shape -->
  <rect x="20" y="120" width="100" height="60" fill="#2ecc71" filter="url(#blur1)"/>
  <text x="30" y="200" font-size="11" fill="#333">Blurred</text>

  <!-- Shadow shape -->
  <rect x="150" y="120" width="100" height="60" fill="#9b59b6" filter="url(#shadow1)"/>
  <text x="160" y="200" font-size="11" fill="#333">Shadow</text>

  <!-- Grayscale shape -->
  <rect x="280" y="120" width="100" height="60" fill="#e67e22" filter="url(#grayscale1)"/>
  <text x="290" y="200" font-size="11" fill="#333">Grayscale</text>

  <!-- Group opacity -->
  <g opacity="0.5" transform="translate(20, 220)">
    <rect width="80" height="50" fill="#e74c3c"/>
    <rect x="40" width="80" height="50" fill="#3498db"/>
  </g>
  <text x="20" y="290" font-size="11" fill="#333">50% opacity group</text>
</svg>
