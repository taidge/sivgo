<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <title>Basic Shapes</title>
  <desc>Test file with basic SVG shapes for visual regression testing.</desc>

  <!-- Rectangle -->
  <rect x="10" y="10" width="100" height="60" fill="#4a90d9" stroke="#2a5a99" stroke-width="2"/>

  <!-- Rounded rectangle -->
  <rect x="130" y="10" width="100" height="60" rx="10" ry="10" fill="#e67e22" stroke="#d35400" stroke-width="2"/>

  <!-- Circle -->
  <circle cx="60" cy="130" r="40" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>

  <!-- Ellipse -->
  <ellipse cx="180" cy="130" rx="50" ry="30" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>

  <!-- Line -->
  <line x1="260" y1="10" x2="380" y2="70" stroke="#9b59b6" stroke-width="3"/>

  <!-- Polyline -->
  <polyline points="260,100 300,140 340,110 380,150" fill="none" stroke="#1abc9c" stroke-width="2"/>

  <!-- Polygon -->
  <polygon points="60,200 100,280 20,280" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>

  <!-- Path (cubic bezier) -->
  <path d="M 130,200 C 150,180 200,280 220,240 S 280,200 300,260" fill="none" stroke="#3498db" stroke-width="2"/>

  <!-- Path (quadratic bezier) -->
  <path d="M 320,200 Q 350,250 380,200 T 380,280" fill="none" stroke="#e91e63" stroke-width="2"/>
</svg>
