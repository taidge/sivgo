<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <title>Text and Transforms</title>

  <!-- Basic text -->
  <text x="10" y="30" font-family="sans-serif" font-size="18" fill="#2c3e50">Hello Sivgo</text>

  <!-- Styled text -->
  <text x="10" y="60" font-family="serif" font-size="14" fill="#e74c3c" font-weight="bold" font-style="italic">Bold Italic Text</text>

  <!-- Text with tspan -->
  <text x="10" y="90" font-family="sans-serif" font-size="14">
    <tspan fill="#3498db">Blue</tspan>
    <tspan fill="#2ecc71" dx="5">Green</tspan>
    <tspan fill="#e67e22" dx="5">Orange</tspan>
  </text>

  <!-- Translated group -->
  <g transform="translate(200, 120)">
    <rect width="60" height="40" fill="#3498db"/>
    <text y="60" font-size="12" fill="#333">Translated</text>
  </g>

  <!-- Rotated group -->
  <g transform="translate(100, 180) rotate(30)">
    <rect width="80" height="30" fill="#e74c3c"/>
    <text y="50" font-size="12" fill="#333">Rotated 30°</text>
  </g>

  <!-- Scaled group -->
  <g transform="translate(300, 180) scale(1.5)">
    <rect width="40" height="25" fill="#2ecc71"/>
    <text y="40" font-size="10" fill="#333">Scaled</text>
  </g>

  <!-- Nested transforms -->
  <g transform="translate(50, 250)">
    <g transform="rotate(15)">
      <rect width="50" height="20" fill="#9b59b6" opacity="0.7"/>
    </g>
    <g transform="translate(70, 0) rotate(-15)">
      <rect width="50" height="20" fill="#f39c12" opacity="0.7"/>
    </g>
  </g>
</svg>
