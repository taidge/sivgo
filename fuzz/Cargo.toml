[package]
name = "sivgo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sivgo-dom = { path = "../crates/dom" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "svg_parse"
path = "fuzz_targets/svg_parse.rs"
doc = false
